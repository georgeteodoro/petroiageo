wells: # This is wells related stuff
  coords: # These are the original (pre-padding) coords (x, y)
    - [15,192] #7-BUZ-10-RJS
    - [25,172] #7-BUZ-29D-RJS
    - [52,60] #8-BUZ-26-RJS
    - [81,272] #7-BUZ-23-RJS
    - [64,200] #3-BRSA-1053-RJS
    - [118,225] #8-BUZ-20-RJS

  window: 3 # window size for which the hypercube is/was padded

# Directory where every file will be treated as a feature
features_folder: "/petrobr/parceirosbr/petrobrasiageo/daniel.campos/data/ANP/v2/area1/npy_disp/" 

# Output path for the porosity cube produced (if any)
porosity_cube_output_path: "./results/porosity.npy" 
# The starting porosity cube file.
starting_porosity_cube_path: "/petrobr/parceirosbr/petrobrasiageo/daniel.campos/data/ANP/v2/area1/cube/exp1/cube.h5"


alg:
  num_its: 40 # Num of iterations to run. Default: 10

  parallel: #parallelism stuff
    #max_points_per_chunk: 10
    n_training_chunks: 1

  sampling: # Sampling strategy stuff
    sampler: "v2"
    
    #V1 PARAMS
    # Num of layers as window size. If negative, use max num of 
    # layers possible. Default: -1
    layers_window_size: 5
    # Max num of points for the sampling. If negative, use all data 
    # available. Default: -1
    max_points: 10000000
    # Function to penalize data from earlier iterations
    # following the beta distribution.
    # Set alpha=1 and beta=1 for no penalty. Default: alpha=1 and beta=1
    beta_dist:
      alpha: 1
      beta: 1

    #V2 PARAMS
    #Max size per porosity bucket. Must be an integer. Default: 100
    bucket_max_size: 100
    #Bucket porosity width. Must be a positive float. Default: 1
    poros_width: 1
    #Min porosity. Must be non-negative. Default: 0
    poros_min: 0
    #Max porosity. Must be non-negative and greater than poros_min. Default: 100
    poros_max: 100
    #Update rate. Must be a float in the interval (0,1]. Default: 0.6
    alpha: 0.6

    #USED BY ALL VERSIONS
    #Seed used by the rng to sample points when needed. Default: 42
    seed: 42

  # If you want to really generate the porosity cube in the end. Default is true
  generate_porosity_cube: true
  
  # If you want to save the porosity cube for every n its. 
  # If negative, ex. -1, save only the last one.
  # Default -1.
  save_cube_every_n_its: -1

  # Indicates the wells that should be used for validation only. 
  # Index starts at 0. Default is an empty list
  validation_only_wells: []
  
  # Indicates the wells that should be used for testing only. 
  # Index starts at 0. Default is an empty list
  test_only_wells: [2]
  # test_only_wells: []

  
  # Feature selection type. Options: ['FORWARD', 'NONE']. Default: FORWARD
  feature_selection_type: "FORWARD"
  
  # Max num of features to select in the feature_selection_step. Default: 1
  max_num_features: 10

    # Size of the window used to generate new features. A window of 3 will
  # generate 3 + 1 + 3 = 7 per axis, so (7x7x7) features in total. 
  # Must be non negative. Default: 3
  window: 3

  # Num of layers to predict at the prediction step. Must be a positive
  # integer. Default: 1
  layers_to_predict: 1
  
  # Max exec time in seconds. If negative there is no limit. Default: -1
  max_exec_time: 1000

  # If it should save metrics for every iteration or don't 
  # save any metrics. Default: true
  metrics_by_it: true
  
  # When it should save the trained model. 
  # Accepted: 'last' (saves only the last one), 
  # 'every_n' where 'n' should be replaced by an int, 
  # a list [1,2,3,...] indicating the iterations.
  # Default: 'last'
  save_models_on: "last"
